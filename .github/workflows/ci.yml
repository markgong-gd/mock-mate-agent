name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mockmate
          POSTGRES_PASSWORD: mockmate
          POSTGRES_DB: mockmate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mockmate -d mockmate_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://mockmate:mockmate@localhost:5432/mockmate_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint（含分层约束）
        run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: 单元测试 + 图测试
        run: pnpm test
      - name: 集成测试（Postgres service）
        run: pnpm test:integration
      - name: 构建
        run: pnpm build
      - name: 前端产物不含服务端变量
        run: |
          if grep -E -l "PROVIDER_|DATABASE_URL|COOKIE_SECRET|ACCESS_PASSWORD" dist/client/assets/*.js; then
            echo "client bundle contains server-only identifiers" && exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mockmate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
